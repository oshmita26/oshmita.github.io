      - name: Music Recommendation Web App
        url: https://oshmita26.github.io/oshmita.github.io/projects/1_project/
        summary: This is a music recommendation engine that suggests songs to the user through an interactive UI, based on their past listening history. For, the machine learning model, we have used KMeans Clustering Algorithm which is a type of unsupervised learning.

      - name: Medi-Assist
        url: https://oshmita26.github.io/oshmita.github.io/projects/2_project/
